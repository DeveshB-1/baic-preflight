[project]
name = "baic-preflight"
version = "0.1.0"
description = "Check a Kubernetes cluster, mirror registry and Postgres against the Uniphore BAIC install guide before helm install"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
baic-preflight = "baic_preflight.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baic_preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["online: fetches the real install guide from GitHub", "live: needs podman"]
